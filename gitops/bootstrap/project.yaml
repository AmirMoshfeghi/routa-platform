# Schema verified 2026-08-17 against Argo CD v3.5.1 docs
# (https://argo-cd.readthedocs.io/en/stable/user-guide/projects/) — the version this
# repo targets, pinned in gitops/platform/argocd-install.md and the argo-cd Helm chart
# version below.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: routa-platform
  namespace: argocd
  annotations:
    # Must exist before the wave-0 Applications that reference
    # `project: routa-platform` (argocd.yaml, cert-manager.yaml, root-*.yaml) —
    # otherwise it lands in the same wave as them with no ordering guarantee.
    # Closes a doc-vs-reality gap: docs/decisions.md Section 20.3 already claimed
    # this annotation existed; it didn't until now. See Section 21.3/22 for the
    # wider sync-wave sequencing this fits into.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: Platform components and demo workloads for the routa cluster
  # Tightened 2026-08-18 (docs/decisions.md Section 35) from "*" to the exact list
  # this platform uses — grepped every `repoURL:` occurrence across gitops/ rather
  # than compiled from memory, so this list is exactly what's actually referenced,
  # not what conceivably could be. Two sources some Helm-savvy readers might expect
  # to see here — Traefik's chart repo and Rancher's chart repo — are deliberately
  # NOT included: neither is ever referenced anywhere under gitops/. Traefik is
  # deployed via RKE2's own bundled HelmChart CR (routa-cp-1..3) and via Ansible on
  # the mgmt node; Rancher is installed entirely via Ansible on the mgmt node's k3s.
  # Neither goes through Argo CD, so neither belongs in an Argo AppProject's access
  # list. Re-grep before adding a new source rather than assuming this list is stale
  # the next time something changes.
  #
  # registry.k8s.io/kueue/charts added 2026-08-18 (Kueue bonus task,
  # gitops/bootstrap/kueue.yaml) — re-grepped the full list at the same time rather
  # than just appending, per the instruction above; the other five were unchanged.
  sourceRepos:
    - https://github.com/AmirMoshfeghi/routa-platform  # this repo — root apps, $values refs
    - https://argoproj.github.io/argo-helm              # argo-cd chart (gitops/bootstrap/argocd.yaml)
    - quay.io/jetstack/charts                           # cert-manager chart, OCI (gitops/bootstrap/cert-manager.yaml)
    - https://prometheus-community.github.io/helm-charts  # kube-prometheus-stack chart
    - https://helm.goharbor.io                          # harbor chart
    - registry.k8s.io/kueue/charts                      # kueue chart, OCI (gitops/bootstrap/kueue.yaml)
  destinations:
    - namespace: "*"
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
