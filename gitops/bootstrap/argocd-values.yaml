# Helm values for the argo-cd chart (pinned 10.4.0, appVersion v3.5.1 — see
# argocd.yaml for the source/version pin itself). Consumed via the multi-source
# Application's `$values` ref, same pattern as gitops/platform/kube-prometheus-stack.
#
# Structure verified 2026-08-17 directly against the chart source at the
# argo-cd-10.4.0 tag (github.com/argoproj/argo-helm), not just the docs prose:
#   charts/argo-cd/values.yaml            — field paths and defaults
#   charts/argo-cd/templates/argocd-server/ingress.yaml — confirms exactly how
#     these values become the rendered Ingress (see comments below).

# ROUTA_ARGOCD_HOSTNAME — three occurrences in this file (global.domain, configs.cm.url,
# server.ingress.hostname), each tagged with this marker on its own line. Rebuild
# note: grepping this repo for ROUTA_ARGOCD_HOSTNAME finds every place the hostname
# needs to change.
global:
  domain: argocd.95.133.252.180.sslip.io  # ROUTA_ARGOCD_HOSTNAME

configs:
  params:
    # Literal dotted map key — becomes the argocd-cmd-params-cm data key
    # `server.insecure: "true"` verbatim (confirmed against
    # argo-cd.readthedocs.io/en/stable/operator-manual/ingress/, Traefik section).
    # Required whenever TLS terminates at the ingress rather than at argocd-server
    # itself — otherwise Traefik and argocd-server both try to own TLS.
    server.insecure: true
  cm:
    # Argo CD uses this for redirect URLs (OIDC callbacks, deep links in
    # notifications) — matters once SSO is added later (deferred, per instruction).
    url: https://argocd.95.133.252.180.sslip.io  # ROUTA_ARGOCD_HOSTNAME

    # --- SSO via Dex + GitHub OAuth, added 2026-08-18 --------------------------
    # Field path verified 2026-08-18 directly against the pinned chart's own
    # values.yaml (argo-cd-10.4.0 tag, lines 227-238): this literal dotted key,
    # under configs.cm, is where Dex connector config actually lives. NOT the
    # top-level `dex:` block elsewhere in this chart — that block (dex.enabled,
    # dex.resources, dex.metrics, etc.) is only the Dex server's own runtime/
    # deployment settings and has no `config:` field for connectors at all.
    #
    # Callback URL: confirmed against
    # argo-cd.readthedocs.io/en/stable/operator-manual/user-management/ that Argo CD
    # always uses /api/dex/callback and there is no redirectURI to set here — it
    # must match https://argocd.95.133.252.180.sslip.io/api/dex/callback, which is
    # what's registered on the GitHub OAuth App side. Verified correct as-is; no
    # change needed on the GitHub App.
    #
    # useLoginAsID: true — confirmed directly against Dex's own source
    # (connector/github/github.go, dexidp/dex): without this, the `sub` claim Argo's
    # RBAC evaluates is GitHub's internal NUMERIC user id, not the username. With
    # it, `identity.UserID = user.Login` — the actual GitHub handle — which is what
    # configs.rbac.policy.csv below matches against. Also avoids putting a personal
    # email address in a public repo (the alternative — matching on the `email`
    # claim instead — would put that in policy.csv in plain sight; the GitHub
    # username is already public in this repo's own URL, so it exposes nothing new).
    #
    # No `orgs:` block — deliberately, there is no GitHub org/team to scope
    # against. REAL CONSEQUENCE, not a detail to skim: without an `orgs:` filter,
    # ANY GitHub account can complete the OAuth login. This is why
    # configs.rbac.policy.default below is role:readonly rather than leaving it
    # empty — authentication alone must not imply any access. See
    # docs/decisions.md Section 32 for the full reasoning.
    dex.config: |
      connectors:
        - type: github
          id: github
          name: GitHub
          config:
            clientID: Ov23lixnKCUCKnl0LfVD
            # $<secret-name>:<key> syntax — looks up `dex.github.clientSecret` in a
            # SEPARATE Kubernetes Secret named argocd-github-oauth, not the default
            # argocd-secret (which Argo CD manages itself and this deliberately does
            # not touch). That secret is created imperatively, once, outside Git —
            # see the kubectl command given alongside this diff. Never appears in
            # this repo in any form.
            clientSecret: $argocd-github-oauth:dex.github.clientSecret
            useLoginAsID: true

  rbac:
    # Field paths verified 2026-08-18 against the same pinned chart's values.yaml
    # (lines 445-478): configs.rbac.policy.default and configs.rbac.policy.csv.
    #
    # policy.default: role:readonly — the deliberate answer to "no org/team to scope
    # against" above. role:readonly is one of Argo CD's built-in roles (no p, lines
    # needed to define it) and grants view-only access to apps/projects/etc. Any
    # authenticated GitHub user gets this floor; nobody gets more without an
    # explicit g, line below.
    policy.default: role:readonly

    # g, <subject>, <role> binds a subject to a role. For SSO users this subject is
    # matched against the token's `sub` claim (confirmed against
    # argo-cd.readthedocs.io/en/stable/operator-manual/rbac/ — sub is always
    # examined "in addition to" whatever `scopes` configures), which is the GitHub
    # username specifically because of useLoginAsID: true above — this line would
    # silently never match without that flag.
    #
    # AmirMoshfeghi is this repo's own GitHub owner (gitops/bootstrap/argocd.yaml's
    # repoURL) — proposed on that basis, NOT independently confirmed as a GitHub
    # login by any API call. Confirm this is correct before applying; a wrong
    # username here just means nobody gets admin (fails safe, not open) but is
    # still worth getting right the first time.
    policy.csv: |
      g, AmirMoshfeghi, role:admin

server:
  ingress:
    enabled: true
    ingressClassName: traefik
    # Explicit rather than relying on the chart's fallback to global.domain — same
    # reasoning as pinning RKE2's ingress-controller instead of its default:
    # correctness shouldn't depend on an implicit fallback continuing to exist.
    hostname: argocd.95.133.252.180.sslip.io  # ROUTA_ARGOCD_HOSTNAME
    # tls: true makes the chart render a `tls:` block on the Ingress with
    # `secretName: argocd-server-tls` (confirmed in templates/argocd-server/ingress.yaml,
    # lines 53-64) — that secretName is what cert-manager's ingress-shim watches for
    # via the annotation below, the same annotation-driven mechanism as any other
    # cert-manager-fronted Ingress.
    tls: true
    annotations:
      # FLIPPED TO PRODUCTION 2026-08-18 (docs/decisions.md Section 34) — staging
      # proved the DNS -> ingress -> HTTP-01 -> cert path first, per Section 18's
      # discipline. That path was confirmed working (staging cert issued and
      # observed on the wire), so this is now the real, browser-trusted cert.
      #
      # Per Section 18: changing this annotation alone does NOT force re-issuance —
      # cert-manager will not re-issue while a valid cert already sits in the target
      # secret (argocd-server-tls), regardless of which Issuer the Ingress now
      # references. The existing staging-issued cert is still within its validity
      # window, so without deleting that secret, Argo CD would keep serving the
      # staging cert indefinitely despite this change — exactly the Rancher incident
      # in Section 18, and the Harbor issuance in Section 30 already accounted for
      # this by starting fresh. The operator deletes argocd-server-tls in the argocd
      # namespace after this syncs, which forces a fresh CertificateRequest against
      # letsencrypt-production. Not done here — this is a values change only.
      cert-manager.io/cluster-issuer: letsencrypt-production

# Admin credential: deliberately NOT set here. Unlike the Rancher chart (which has no
# built-in bootstrap flow and needed an explicit bootstrapPassword gate — see
# ansible/roles/rancher/tasks/main.yml), the Argo CD chart's documented default
# behavior is to auto-generate a per-install admin password in the
# `argocd-initial-admin-secret` Secret, retrievable with:
#   kubectl -n argocd get secret argocd-initial-admin-secret \
#     -o jsonpath='{.data.password}' | base64 -d
# That satisfies "no credentials in this repo" without needing an env-var gate —
# nothing is generated by us, nothing needs to be supplied by us.
