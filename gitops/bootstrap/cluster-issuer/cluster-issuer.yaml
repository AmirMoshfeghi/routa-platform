# Let's Encrypt ClusterIssuers, HTTP-01 via the RKE2 cluster's Traefik ingress class.
#
# MOVED here (from a bare resource inside gitops/bootstrap/'s own kustomize build)
# on 2026-08-17, in response to a real Argo CD sync failure — see
# gitops/bootstrap/cluster-issuer-app.yaml and docs/decisions.md Section 23 for the
# full explanation. Short version: these objects depend on a CRD
# (clusterissuers.cert-manager.io) that cert-manager.yaml installs, and bundling a
# CRD-dependent CR in the SAME Application/sync as unrelated resources means Argo's
# comparison/dry-run pass over that Application's WHOLE resource list trips over the
# not-yet-registered kind — regardless of any sync-wave annotation on the resource
# itself, because sync-waves order *apply*, not the validation pass that happens
# before it. This directory is now its own Application specifically so its
# validation/apply cycle is independent of bootstrap's.
#
# No sync-wave annotation on these objects anymore — that ordering hint now lives on
# the wrapping Application (cluster-issuer-app.yaml) as one of bootstrap's own
# managed resources, not here. A wave annotation on these two objects would be
# meaningless in isolation (nothing else in this directory to order against) and
# would misleadingly imply a cross-Application ordering guarantee that this
# annotation, at this level, cannot actually provide.
#
# Cluster-scoped, so — same reasoning as cert-manager.yaml — this stays under
# gitops/bootstrap/, not gitops/platform/ (three environment copies would collide on
# one cluster-scoped resource).
#
# Both staging AND production are defined here, always, rather than one ClusterIssuer
# whose ACME server gets edited in place. That is deliberate, and traces directly to
# the Rancher TLS incident (docs/decisions.md Section 18): cert-manager does not
# re-issue while a valid cert already sits in the target Secret, so editing an
# Issuer's server field in place is a change that LOOKS like it did something (the
# object updates, Ready stays True) but is actually a silent no-op for issuance until
# the Secret is deleted. Keeping both issuers as separate, always-present objects
# means "switch to production" is an unambiguous action — change which issuer an
# Ingress annotation names — rather than a mutation of shared state with a
# non-obvious side effect.
#
# ACME directory URLs and the acme.solvers[].http01.ingress.ingressClassName field
# shape verified 2026-08-17 against cert-manager.io/docs/configuration/acme/.
#
# email supplied by the operator 2026-08-17. Same address in both issuers below —
# ROUTA_LETSENCRYPT_EMAIL marks both occurrences for a rebuild.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: amh.moshfeghi@gmail.com  # ROUTA_LETSENCRYPT_EMAIL
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-production
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: amh.moshfeghi@gmail.com  # ROUTA_LETSENCRYPT_EMAIL
    privateKeySecretRef:
      name: letsencrypt-production-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
