# Vendored from https://raw.githubusercontent.com/rancher/local-path-provisioner/
# v0.0.37/deploy/local-path-storage.yaml (fetched and pinned 2026-08-17 — v0.0.37 was
# the latest stable release at that date, github.com/rancher/local-path-provisioner/releases).
#
# WHY THIS EXISTS AT ALL: RKE2 does not bundle a default StorageClass or a
# local-path provisioner. This surprised the investigation that led to this file —
# see docs/decisions.md Section 25 for the full root-cause writeup, but the short
# version: RKE2's `disable` flag's valid values (docs.rke2.io/reference/server_config,
# verified 2026-08-17) are `rke2-coredns, rke2-metrics-server,
# rke2-snapshot-controller, rke2-snapshot-controller-crd,
# rke2-snapshot-validation-webhook` — no local-path-storage component is in that list
# because RKE2 never packages one, unlike k3s (confirmed live: the mgmt node's k3s
# has a `local-path` StorageClass provisioned automatically; the RKE2 cluster does
# not, and never did — this was not something our Ansible config disabled).
#
# ONLY ONE MODIFICATION from the upstream file: the ConfigMap's embedded
# `helperPod.yaml` (a Pod spec written as a YAML string, not a structured field —
# Kustomize patches can't reach inside an opaque string value) pins
# `docker.io/library/busybox` to `docker.io/library/busybox:1.38.0`. Upstream ships
# it untagged (implicit `latest`), which conflicts with CLAUDE.md rule 2. Everything
# else below is byte-for-byte the upstream file — diff against the URL above before
# re-vendoring a newer version, rather than assuming this has drifted further.
#
# The StorageClass's storageclass.kubernetes.io/is-default-class annotation is
# NOT added here — that's a genuine structured-field change, applied cleanly via
# the Kustomize patch in this directory's kustomization.yaml instead of hand-editing
# the vendored resource, so the two kinds of change (an unreachable string fix vs. a
# normal field patch) each use the mechanism actually suited to them.
apiVersion: v1
kind: Namespace
metadata:
  name: local-path-storage

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: local-path-provisioner-service-account
  namespace: local-path-storage

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: local-path-provisioner-role
  namespace: local-path-storage
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: local-path-provisioner-role
rules:
  - apiGroups: [""]
    resources: ["nodes", "persistentvolumeclaims", "configmaps", "pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: local-path-provisioner-bind
  namespace: local-path-storage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: local-path-provisioner-role
subjects:
  - kind: ServiceAccount
    name: local-path-provisioner-service-account
    namespace: local-path-storage

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: local-path-provisioner-bind
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: local-path-provisioner-role
subjects:
  - kind: ServiceAccount
    name: local-path-provisioner-service-account
    namespace: local-path-storage

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: local-path-provisioner
  namespace: local-path-storage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: local-path-provisioner
  template:
    metadata:
      labels:
        app: local-path-provisioner
    spec:
      serviceAccountName: local-path-provisioner-service-account
      containers:
        - name: local-path-provisioner
          image: docker.io/rancher/local-path-provisioner:v0.0.37
          imagePullPolicy: IfNotPresent
          command:
            - local-path-provisioner
            - --debug
            - start
            - --config
            - /etc/config/config.json
          ports:
            - name: health
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: health
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: config-volume
              mountPath: /etc/config/
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: CONFIG_MOUNT_PATH
              value: /etc/config/
            - name: HEALTH_PORT
              value: "8080"
      volumes:
        - name: config-volume
          configMap:
            name: local-path-config

---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: local-path
provisioner: rancher.io/local-path
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete

---
kind: ConfigMap
apiVersion: v1
metadata:
  name: local-path-config
  namespace: local-path-storage
data:
  config.json: |-
    {
            "nodePathMap":[
            {
                    "node":"DEFAULT_PATH_FOR_NON_LISTED_NODES",
                    "paths":["/opt/local-path-provisioner"]
            }
            ]
    }
  setup: |-
    #!/bin/sh
    set -eu
    mkdir -m 0777 -p "$VOL_DIR"
  teardown: |-
    #!/bin/sh
    set -eu
    rm -rf "$VOL_DIR"
  helperPod.yaml: |-
    apiVersion: v1
    kind: Pod
    metadata:
      name: helper-pod
    spec:
      priorityClassName: system-node-critical
      tolerations:
        - key: node.kubernetes.io/disk-pressure
          operator: Exists
          effect: NoSchedule
      containers:
      - name: helper-pod
        image: docker.io/library/busybox:1.38.0
        imagePullPolicy: IfNotPresent
