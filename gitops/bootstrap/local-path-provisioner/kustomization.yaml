# Applies a clean, structured patch on top of the vendored upstream manifest rather
# than hand-editing it — see local-path-storage.yaml's header for why the ONE other
# change in this directory (the busybox helper-pod tag) had to be a direct edit
# instead: it lives inside an opaque ConfigMap string value, not a field Kustomize's
# patch engine can address. This one, by contrast, is a normal structured field.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - local-path-storage.yaml

patches:
  - target:
      kind: StorageClass
      name: local-path
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          storageclass.kubernetes.io/is-default-class: "true"
