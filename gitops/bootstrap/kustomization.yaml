apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - project.yaml
  - bootstrap.yaml
  - argocd.yaml
  - cert-manager.yaml
  - cluster-issuer-app.yaml
  - local-path-provisioner-app.yaml
  - kueue.yaml
  - kueue-config-app.yaml
  - root-dev.yaml
  - root-staging.yaml
  - root-prod.yaml
# argocd-values.yaml is deliberately NOT listed here: it's a plain Helm values file
# (no apiVersion/kind) consumed by argocd.yaml's multi-source $values ref, not a
# Kubernetes resource Kustomize should try to parse.
#
# cluster-issuer/ (the directory) is ALSO deliberately not listed here — it is no
# longer part of bootstrap's own resource set. cluster-issuer-app.yaml is the
# Application that points AT that directory as its own separate sync target. See
# docs/decisions.md Section 23 for why this had to be split out.
#
# local-path-provisioner/ (the directory) is likewise not listed here for the same
# reason — local-path-provisioner-app.yaml points at it as its own separate sync
# target. Unlike cluster-issuer/, this one HAS its own kustomization.yaml (a patch
# adding the default-StorageClass annotation), so Argo syncs it via Kustomize rather
# than as a plain-manifest directory — see gitops/bootstrap/local-path-provisioner/
# kustomization.yaml.
#
# kueue-config/ (the directory) follows the same split as cluster-issuer/:
# kueue-config-app.yaml points at it as its own separate sync target, decoupled from
# bootstrap's own sync, because its ResourceFlavor/ClusterQueue objects depend on
# CRDs kueue.yaml installs.
