# Chart version verified 2026-08-17 via https://artifacthub.io/packages/helm/harbor/harbor
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: harbor
  namespace: argocd
spec:
  project: routa-platform
  sources:
    - repoURL: https://helm.goharbor.io
      chart: harbor
      targetRevision: "1.19.2"
      helm:
        valueFiles:
          - $values/gitops/platform/harbor/values.yaml
    - repoURL: REPLACE_ME
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: harbor
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
