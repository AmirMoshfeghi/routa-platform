---
# Phase 2: connects as routa_admin_user (see rke2-cluster.yml for why).
# Any of the 3 RKE2 servers would have a valid admin kubeconfig; fetch from the
# bootstrap node specifically for a stable, deterministic target.
- name: Fetch admin kubeconfig from the RKE2 bootstrap server
  hosts: rke2_server_init
  become: true
  vars:
    ansible_user: "{{ routa_admin_user }}"
  roles:
    - kubeconfig-fetch
