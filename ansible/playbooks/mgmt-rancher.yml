---
# Rancher Manager on routa-mgmt: single-node k3s, a pinned Traefik ingress,
# cert-manager, then Rancher itself.
#
# Deliberately NOT in gitops/. Argo CD delivers workloads *into* the RKE2 cluster;
# Rancher *manages* clusters and has to outlive the cluster it manages, so it runs on
# its own k3s node and is installed by configuration management like any other piece
# of node-level software. Putting it in gitops/ would make the management plane a
# tenant of the thing it manages.
#
# Phase 2 play: connects as routa_admin_user, not root — hardening.yml created that
# user and disabled root SSH login. Set via play vars because those (precedence 12)
# beat the inventory's ansible_user (3-6); see inventory/group_vars/all.yml for why
# remote_user is deliberately not used for this.
#
# Requires an exported bootstrap password (asserted by the rancher role):
#   export RANCHER_BOOTSTRAP_PASSWORD='...'
#   ansible-playbook playbooks/mgmt-rancher.yml -e rancher_letsencrypt_email=you@example.org
#
# Version pins and the reasoning behind each: inventory/group_vars/mgmt.yml.

- name: Install k3s and Rancher Manager on the management node
  hosts: mgmt
  become: true
  vars:
    ansible_user: "{{ routa_admin_user }}"
  environment:
    # helm needs this explicitly; `k3s kubectl` finds it on its own. Left at k3s's
    # default 0600 root-owned permissions rather than loosened to 0644 — see the
    # note in roles/k3s-server/tasks/main.yml.
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  roles:
    - k3s-server
    - rancher
