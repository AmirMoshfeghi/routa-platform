---
# Versions verified 2026-08-17 against:
#   https://github.com/rancher/rke2/releases/tag/v1.36.3%2Brke2r1
# RKE2 v1.36.3+rke2r1 bundles rke2-cilium chart 1.19.601 (upstream Cilium 1.19.6) when
# `cni: cilium` is selected. That bundled version is NOT independently overridable by
# picking a different Cilium chart version here — it ships with the RKE2 release.
# Bumping rke2_version below changes the bundled Cilium version too; re-verify via the
# RKE2 release notes (Packaged Component Versions table) before bumping, per CLAUDE.md.
rke2_version: "v1.36.3+rke2r1"
rke2_cilium_chart_version: "1.19.601"   # informational only — not a standalone install target
rke2_channel: "stable"

rke2_cni: "cilium"

# 3-server RKE2 HA control plane with embedded etcd (routa-cp-1/2/3), not a single
# server + agents. All three are full servers and all three are schedulable for
# regular workloads — no control-plane taint. Config keys verified 2026-08-17 against
# https://docs.rke2.io/install/ha:
#   - the bootstrap node (rke2_server_init) starts with no special flag and
#     auto-generates a token at rke2_token_path below
#   - joining nodes (rke2_server_join) need `server: https://<bootstrap>:9345` and the
#     matching `token` — see ansible/roles/rke2-server/templates/config.yaml.j2
#   - `cni`, `cluster-cidr`, `service-cidr` and `token` are "critical" flags that must
#     match exactly across all three servers or the join fails with "critical
#     configuration value mismatch" — cni is shared here via this file so bootstrap
#     and joiners can't drift
# Confirmed separately (via https://github.com/rancher/rke2/issues/508) that RKE2
# does NOT taint server nodes by default — inherited from k3s — so "schedulable, no
# taint" is the out-of-the-box behavior, not something configured here.
# Odd node count (3) is required for etcd to hold quorum; tolerates one node failure.
rke2_data_dir: /var/lib/rancher/rke2

# Generated by the bootstrap node, read by the two joining servers (both handled by
# the single rke2-server role — see roles/rke2-server/tasks/main.yml).
rke2_token_path: /var/lib/rancher/rke2/server/node-token

# --- API endpoint and TLS SANs -------------------------------------------------
# etcd is genuinely HA across all 3 servers, but API *access* currently points at a
# single node: routa-cp-1 (the bootstrap server). There is no load balancer or DNS
# name in front of the three API servers yet — see docs/decisions.md Section 12 for
# why that is deferred and what the production answer looks like.
#
# Both the kubeconfig rewrite (roles/kubeconfig-fetch) and the Rancher import will
# use this address, so it is defined once here rather than in each consumer.
rke2_api_endpoint_host: "{{ hostvars[groups['rke2_server_init'][0]].ansible_host }}"
rke2_api_endpoint: "https://{{ rke2_api_endpoint_host }}:6443"

# `tls-san` adds "additional hostnames or IPv4/IPv6 addresses as Subject Alternative
# Names on the server TLS cert" (https://docs.rke2.io/reference/server_config,
# verified 2026-08-17; YAML list under the hyphenated key `tls-san`).
#
# Derived from the Terraform-generated inventory rather than hardcoded, so it tracks
# `worker_count` automatically and cannot drift from the real IPs. All 3 server IPs
# go in the cert — not just the current endpoint — so that moving the endpoint to
# another node (or later to an LB/DNS name appended to this list) does not require
# reissuing certs and rebuilding the cluster. `unique` collapses the endpoint host,
# which today is already one of the three.
rke2_tls_san: "{{ ((groups['rke2_server'] | map('extract', hostvars, 'ansible_host') | list) + [rke2_api_endpoint_host]) | unique | list }}"

ansible_python_interpreter: /usr/bin/python3
