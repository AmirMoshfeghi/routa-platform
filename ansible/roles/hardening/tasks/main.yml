---
# Baseline OS hardening, run against every node before RKE2 is installed.
# See docs.verda.com/cpu-and-gpu-instances/securing-your-instance/ for the
# provider's own baseline recommendations this extends.

- name: Update apt cache
  apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install unattended-upgrades
  apt:
    name: unattended-upgrades
    state: present
  when: hardening_unattended_upgrades | bool

- name: Enable unattended-upgrades
  copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    mode: "0644"
  when: hardening_unattended_upgrades | bool

- name: Disable SSH password authentication
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PasswordAuthentication'
    line: 'PasswordAuthentication no'
  when: hardening_disable_password_auth | bool
  notify: restart sshd

- name: Disable SSH root login
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PermitRootLogin'
    line: 'PermitRootLogin no'
  notify: restart sshd

- name: Install ufw
  apt:
    name: ufw
    state: present

- name: Allow SSH before enabling ufw (avoid lockout)
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp

- name: Allow role-specific TCP ports
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: "{{ hardening_allowed_tcp_ports }}"

- name: Enable ufw with default-deny incoming
  community.general.ufw:
    state: enabled
    policy: deny
    direction: incoming
